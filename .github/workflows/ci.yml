name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Also publish the fixture build to the ci-fixture channel (creates a tag and release in this repo)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: Roblox/setup-foreman@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          allow-external-github-orgs: true

      # Same as running `lute ci` locally; see .lute/ci.luau.
      - run: lute ci

  # rbxm-pull's Jest tests and an end-to-end apply of a real build with the released Apply
  # module, as Open Cloud Luau Execution tasks (no Studio on CI runners), on every CI run.
  # Skipped with a warning when the ROBLOX_* secrets aren't available (not set yet, or a pull
  # request from a fork). See "In the cloud" in CONTRIBUTING.md.
  pull-tests:
    runs-on: ubuntu-latest
    # One run at a time: Roblox allows 5 task creations a minute per account.
    concurrency:
      group: rbxm-pull-cloud-tests
      cancel-in-progress: false
    env:
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
      ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID }}
      ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_PLACE_ID }}
    steps:
      - id: secrets
        shell: bash
        run: |
          if [ -n "$ROBLOX_API_KEY" ] && [ -n "$ROBLOX_UNIVERSE_ID" ] && [ -n "$ROBLOX_PLACE_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Skipping rbxm-pull's cloud tests: set the ROBLOX_API_KEY, ROBLOX_UNIVERSE_ID and ROBLOX_PLACE_ID secrets."
          fi

      - if: steps.secrets.outputs.present
        uses: actions/checkout@v5

      - if: steps.secrets.outputs.present
        uses: Roblox/setup-foreman@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          allow-external-github-orgs: true

      - if: steps.secrets.outputs.present
        run: lute pull-tests --cloud

      - if: steps.secrets.outputs.present
        run: lute apply-e2e --cloud

  # Runs the publish action from this checkout, the way consumers use it.
  action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - id: publish
        uses: ./publish
        with:
          config: publish/tests/fixtures/game/rbxm-publish.json
          channel: ci-fixture
          allowed-refs: ${{ github.ref }}
          release: false

      - name: Check outputs
        shell: bash
        run: |
          test "${{ steps.publish.outputs.commit }}" = "$GITHUB_SHA"
          test "${#SHA256}" -eq 64
          test "${{ steps.publish.outputs.published }}" = "false"
        env:
          SHA256: ${{ steps.publish.outputs.sha256 }}

  # One check for branch protection to require, whatever platforms the matrix above covers.
  # always() so it reports a failure instead of being skipped (which counts as passing).
  action-all:
    name: action (all platforms)
    if: always()
    needs: action
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: test "${{ needs.action.result }}" = "success"

  # End-to-end release against the real GitHub API. Manual only: it moves the ci-fixture tag.
  action-release:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: [check, action]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: rbxm-publish-ci-fixture
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - id: publish
        uses: ./publish
        with:
          config: publish/tests/fixtures/game/rbxm-publish.json
          channel: ci-fixture
          allowed-refs: ${{ github.ref }}

      - name: Check the published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "published=${{ steps.publish.outputs.published }} url=${{ steps.publish.outputs.release-url }}"
          gh release download ci-fixture --repo "$GITHUB_REPOSITORY" --dir downloaded
          test "$(sha256sum downloaded/managed.rbxm | cut -d' ' -f1)" = "${{ steps.publish.outputs.sha256 }}"
          grep -q "\"commit\": \"$GITHUB_SHA\"" downloaded/build.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/ci-fixture" --jq .object.sha)" = "$GITHUB_SHA"
