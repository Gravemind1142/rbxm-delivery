name: Release

# Pushing a tag like v0.1.0 builds rbxm-publish for each platform with `lute compile` and
# publishes a GitHub release that Foreman can install from:
#   rbxm-publish = { github = "Gravemind1142/rbxm-delivery", version = "=0.1.0" }
# The same tag is the `rev` projects pin the rbxm-apply Lute package (pull/pkg.luau) to.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The tag must match every version in the source, so `rbxm-publish --version`, Foreman, the
  # plugin and the rbxm-apply package all agree.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the source version
        shell: bash
        run: |
          cli="$(sed -n 's/^return "\(.*\)"$/\1/p' publish/src/version.luau)"
          plugin="$(sed -n 's/^version = "\(.*\)"$/\1/p' pull/wally.toml)"
          package="$(sed -n 's/^[[:space:]]*version = "\(.*\)",$/\1/p' pull/pkg.luau)"
          apply="$(sed -n 's/^Apply.VERSION = "\(.*\)"$/\1/p' pull/src/Apply/init.luau)"
          echo "tag=$GITHUB_REF_NAME rbxm-publish=$cli rbxm-pull=$plugin rbxm-apply=$package Apply.VERSION=$apply"
          test "$GITHUB_REF_NAME" = "v$cli" || { echo "::error::Tag $GITHUB_REF_NAME doesn't match publish/src/version.luau ($cli)"; exit 1; }
          test "$GITHUB_REF_NAME" = "v$plugin" || { echo "::error::Tag $GITHUB_REF_NAME doesn't match pull/wally.toml ($plugin)"; exit 1; }
          test "$GITHUB_REF_NAME" = "v$package" || { echo "::error::Tag $GITHUB_REF_NAME doesn't match pull/pkg.luau ($package)"; exit 1; }
          test "$GITHUB_REF_NAME" = "v$apply" || { echo "::error::Tag $GITHUB_REF_NAME doesn't match Apply.VERSION in pull/src/Apply/init.luau ($apply)"; exit 1; }

  # The rbxm-pull Studio plugin, so users can install it without the toolchain.
  plugin:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Roblox/setup-foreman@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          allow-external-github-orgs: true

      - run: lute build-plugin

      - uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: build/RbxmPull.rbxm

  compile:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          # Same platforms Lute itself ships for.
          - { os: ubuntu-latest, target: linux-x86_64, exe: rbxm-publish }
          - { os: ubuntu-24.04-arm, target: linux-aarch64, exe: rbxm-publish }
          - { os: macos-latest, target: macos-aarch64, exe: rbxm-publish }
          - { os: windows-latest, target: windows-x86_64, exe: rbxm-publish.exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # Only Lute and Rojo, at the versions pinned in foreman.toml. `foreman install` would
      # fail here: the dev-only tools (Selene, Wally, studio-run) have no linux-aarch64 builds.
      - name: Install Lute and Rojo
        env:
          RBXM_PUBLISH_BIN: ${{ runner.temp }}/tools
        run: bash publish/action/install-tools.sh

      - name: Compile
        run: lute build-cli --out "dist/${{ matrix.exe }}"

      - name: Smoke test
        run: |
          "dist/${{ matrix.exe }}" build --config publish/tests/fixtures/game/rbxm-publish.json \
            --out build/smoke --commit "$GITHUB_SHA" --ref refs/heads/main

      - name: Package
        run: |
          name="rbxm-publish-${GITHUB_REF_NAME}-${{ matrix.target }}.zip"
          # The binary goes at the root of the zip, where Foreman looks for it.
          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd dist && 7z a "../$name" "${{ matrix.exe }}")
          else
            (cd dist && zip "../$name" "${{ matrix.exe }}")
          fi
          echo "ZIP=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ZIP }}

  release:
    needs: [compile, plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --latest so the rolling channel releases (dev-latest, ci-fixture) never show as the
          # repo's latest release.
          gh release create "$GITHUB_REF_NAME" assets/*.zip assets/RbxmPull.rbxm \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --latest
